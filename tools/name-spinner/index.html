<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កងបង្វិលចាប់ឈ្មោះសិស្ស (Name Spinner)</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    .spinner-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      margin-top: 1rem;
    }

    @media (min-width: 768px) {
      .spinner-container {
        grid-template-columns: 1.1fr 1fr;
      }
    }

    .wheel-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 400px;
      position: relative;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
    }

    .wheel-svg-container {
      width: 100%;
      height: 100%;
      transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: calc(50% - 15px);
      width: 30px;
      height: 30px;
      z-index: 100;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      transform: rotate(180deg);
    }

    .control-panel {
      padding: 2rem;
    }

    .names-textarea {
      width: 100%;
      height: 120px;
      font-family: var(--font-khmer);
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.6);
      color: white;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      resize: none;
      font-size: 0.95rem;
    }

    .names-textarea:focus {
      outline: none;
      border-color: #06b6d4;
    }

    .result-announcement {
      margin-top: 1.5rem;
      font-size: 1.8rem;
      font-weight: 800;
      color: #06b6d4;
      min-height: 40px;
      text-align: center;
      animation: pulseResult 1s infinite alternate;
    }

    @keyframes pulseResult {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .db-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1" style="background: #06b6d4;"></div>
    <div class="blob blob-2" style="background: #3b82f6;"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="main-container">
    <div class="spinner-container">
      
      <!-- Wheel Panel -->
      <section class="glass-panel wheel-panel">
        <svg class="wheel-pointer" viewBox="0 0 30 30" width="30" height="30">
          <polygon points="15,0 30,30 0,30" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
        </svg>

        <div class="wheel-wrapper">
          <div class="wheel-svg-container" id="wheelNode">
            <svg width="320" height="320" viewBox="0 0 200 200" id="wheelSvg">
              <!-- Drawn by JS -->
            </svg>
          </div>
        </div>

        <button class="btn btn-primary" id="spinBtn" onclick="spinWheel()" style="background: linear-gradient(135deg, #06b6d4, #3b82f6); margin-top: 2rem; padding: 1rem 3rem; font-size: 1.2rem; font-weight:800; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);">
          🎯 បង្វិលចាប់ឈ្មោះ
        </button>

        <div class="result-announcement" id="resultLabel"></div>
      </section>

      <!-- Control Panel -->
      <section class="glass-panel control-panel">
        <h3 style="font-size: 1.25rem; font-weight:700; margin-bottom: 0.5rem;">✍️ បញ្ជីឈ្មោះសិស្សសម្រាប់បង្វិល</h3>
        
        <div id="dbStatusArea">
          <!-- Database status dynamically shown -->
        </div>

        <div class="form-group">
          <textarea id="namesInput" class="names-textarea" placeholder="បញ្ចូលឈ្មោះសិស្សទីនេះ..."></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <button class="btn btn-secondary" onclick="loadFromDatabase()" style="border-color: #22c55e;">📥 ទាញពី Database</button>
          <button class="btn btn-secondary" onclick="resetNameList('clear')">សម្អាត</button>
          <button class="btn btn-success" onclick="applyNames()" style="flex-grow: 1;">ធ្វើឱ្យទាន់សម័យ</button>
        </div>
      </section>

    </div>
  </main>

  <script src="../../shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedPage('១២. កងបង្វិលចាប់ឈ្មោះសិស្ស (Name Spinner)', true);
      
      // Load from database if present, otherwise load fallbacks
      loadFromDatabase();
    });

    let names = [];
    let isSpinning = false;
    let currentRotation = 0;
    const colors = [
      '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', 
      '#a855f7', '#d946ef', '#ec4899', '#f43f5e', '#14b8a6', 
      '#10b981', '#22c55e', '#84cc16', '#eab308', '#f97316'
    ];

    const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    function toKhmerNum(num) {
      return num.toString().split('').map(char => {
        if (isNaN(parseInt(char))) return char;
        return khmerDigits[parseInt(char)];
      }).join('');
    }

    function loadFromDatabase() {
      playClickSound();
      const dbStudents = getStudents();
      const statusArea = document.getElementById('dbStatusArea');
      
      if (dbStudents.length > 0) {
        const studentNames = dbStudents.map(s => s.name);
        document.getElementById('namesInput').value = studentNames.join('\n');
        
        statusArea.innerHTML = `
          <div class="db-badge">
            ✅ បានទាញឈ្មោះសិស្ស ${toKhmerNum(dbStudents.length)} នាក់ពីឃ្លាំងទិន្នន័យ
          </div>
        `;
        showToast('បានទាញយកឈ្មោះសិស្សពីឃ្លាំងទិន្នន័យ!', 'success');
      } else {
        // Fallback demo names
        document.getElementById('namesInput').value = 'វិច្ឆិកា\nសុភា\nកុសល\nរក្សា\nរតនា\nចិន្តា\nនារី\nសិលា';
        statusArea.innerHTML = `
          <div class="db-badge" style="background: rgba(234, 179, 8, 0.15); border-color: rgba(234, 179, 8, 0.3); color: #fef08a;">
            ⚠️ គ្មានទិន្នន័យក្នុងឃ្លាំងទេ (ប្រើប្រាស់ឈ្មោះគំរូជំនួស)
          </div>
        `;
      }

      applyNames();
    }

    function resetNameList(action) {
      playClickSound();
      if (action === 'clear') {
        document.getElementById('namesInput').value = '';
      }
      applyNames();
    }

    function applyNames() {
      playClickSound();
      const txt = document.getElementById('namesInput').value.trim();
      if (!txt) {
        names = [];
        drawEmptyWheel();
        return;
      }
      
      names = txt.split('\n').map(n => n.trim()).filter(n => n !== '');
      drawWheel();
      document.getElementById('resultLabel').textContent = '';
    }

    function drawEmptyWheel() {
      const svg = document.getElementById('wheelSvg');
      svg.innerHTML = `
        <circle cx="100" cy="100" r="95" fill="rgba(255,255,255,0.03)" stroke="var(--glass-border)" stroke-width="4" />
        <text x="100" y="100" font-size="12" fill="var(--text-muted)" text-anchor="middle" dominant-baseline="middle" font-family="var(--font-khmer)">គ្មានឈ្មោះ</text>
      `;
    }

    function drawWheel() {
      const svg = document.getElementById('wheelSvg');
      svg.innerHTML = '';

      if (names.length === 0) {
        drawEmptyWheel();
        return;
      }

      const total = names.length;
      const angleStep = 360 / total;

      for (let i = 0; i < total; i++) {
        const startAngle = i * angleStep;
        const endAngle = (i + 1) * angleStep;
        const color = colors[i % colors.length];

        const r = 95;
        const cx = 100;
        const cy = 100;

        const rad1 = ((startAngle - 90) * Math.PI) / 180;
        const rad2 = ((endAngle - 90) * Math.PI) / 180;

        const x1 = cx + r * Math.cos(rad1);
        const y1 = cy + r * Math.sin(rad1);
        const x2 = cx + r * Math.cos(rad2);
        const y2 = cy + r * Math.sin(rad2);

        const largeArc = angleStep > 180 ? 1 : 0;
        let d = '';

        if (total === 1) {
          svg.innerHTML += `<circle cx="100" cy="100" r="95" fill="${color}" stroke="rgba(255,255,255,0.3)" stroke-width="2" />`;
        } else {
          d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
          const sector = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          sector.setAttribute('d', d);
          sector.setAttribute('fill', color);
          sector.setAttribute('stroke', 'rgba(255, 255, 255, 0.25)');
          sector.setAttribute('stroke-width', '1.5');
          svg.appendChild(sector);
        }

        const textAngle = startAngle + angleStep / 2 - 90;
        const textRad = (textAngle * Math.PI) / 180;
        
        const labelX = cx + (r * 0.55) * Math.cos(textRad);
        const labelY = cy + (r * 0.55) * Math.sin(textRad);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', labelX.toString());
        label.setAttribute('y', labelY.toString());
        label.setAttribute('fill', '#ffffff');
        label.setAttribute('font-size', total > 10 ? '6' : '9');
        label.setAttribute('font-weight', '700');
        label.setAttribute('font-family', 'var(--font-khmer)');
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');

        const rotAngle = textAngle + 90;
        label.setAttribute('transform', `rotate(${rotAngle}, ${labelX}, ${labelY})`);

        let txtVal = names[i];
        if (txtVal.length > 8) txtVal = txtVal.substring(0, 7) + '..';
        label.textContent = txtVal;
        
        svg.appendChild(label);
      }

      const centerPin = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      centerPin.setAttribute('cx', '100');
      centerPin.setAttribute('cy', '100');
      centerPin.setAttribute('r', '10');
      centerPin.setAttribute('fill', '#ffffff');
      centerPin.setAttribute('stroke', '#1e1b4b');
      centerPin.setAttribute('stroke-width', '3');
      svg.appendChild(centerPin);
    }

    function spinWheel() {
      if (isSpinning || names.length === 0) return;
      
      playClickSound();
      isSpinning = true;
      document.getElementById('resultLabel').textContent = '';
      
      const total = names.length;
      const targetIndex = Math.floor(Math.random() * total);
      
      const angleStep = 360 / total;
      const targetSliceCenter = (targetIndex * angleStep) + (angleStep / 2);
      const relativeSpinAngle = 360 - targetSliceCenter;

      const additionalSpins = 10 * 360;
      const spinRotation = currentRotation + additionalSpins + relativeSpinAngle - (currentRotation % 360);

      currentRotation = spinRotation;

      const wheel = document.getElementById('wheelNode');
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      let tickCount = 0;
      const tickSoundInterval = setInterval(() => {
        if (!isSpinning) {
          clearInterval(tickSoundInterval);
          return;
        }
        playClickSound();
        tickCount++;
      }, 300);

      setTimeout(() => {
        clearInterval(tickSoundInterval);
        isSpinning = false;
        
        const resultName = names[targetIndex];
        document.getElementById('resultLabel').textContent = `🙋‍♂️ សិស្សដែលជាប់៖ ${resultName}`;
        
        playSuccessSound();
        triggerConfetti();
      }, 6000);
    }
  </script>
</body>
</html>
