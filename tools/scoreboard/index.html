<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ក្តារចុចពិន្ទុក្រុម (Scoreboard)</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    .score-layout {
      margin-top: 1rem;
    }

    .action-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .team-card {
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.75rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .team-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--team-color, #a855f7);
    }

    .team-name-input {
      font-family: var(--font-khmer);
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      text-align: center;
      width: 80%;
      margin: 0.5rem 0 1rem 0;
      padding: 2px;
      outline: none;
    }

    .team-name-input:focus {
      border-bottom-color: var(--team-color, #a855f7);
    }

    .team-score {
      font-size: 5rem;
      font-weight: 900;
      color: white;
      margin: 1rem 0;
      line-height: 1;
    }

    .score-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .score-btn {
      padding: 0.5rem;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      cursor: pointer;
      font-family: var(--font-khmer);
      transition: var(--transition);
    }

    .score-btn:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }

    .score-btn-plus {
      background: rgba(34, 197, 94, 0.1) !important;
      border-color: rgba(34, 197, 94, 0.3) !important;
      color: #a3e635 !important;
    }

    .score-btn-plus:hover {
      background: rgba(34, 197, 94, 0.2) !important;
    }

    .score-btn-minus {
      background: rgba(239, 68, 68, 0.1) !important;
      border-color: rgba(239, 68, 68, 0.3) !important;
      color: #fca5a5 !important;
    }

    .score-btn-minus:hover {
      background: rgba(239, 68, 68, 0.2) !important;
    }
  </style>
</head>
<body>

  <!-- Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1" style="background: #a855f7;"></div>
    <div class="blob blob-2" style="background: #ec4899;"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="main-container">
    <div class="score-layout">
      
      <!-- Top Action bar -->
      <div class="action-row">
        <button class="btn btn-primary" onclick="addTeam()">➕ បន្ថែមក្រុមថ្មី</button>
        <button class="btn btn-danger" onclick="resetAllScores()">🔄 កំណត់ពិន្ទុឡើងវិញ</button>
        <button class="btn btn-secondary" onclick="removeAllTeams()">🗑️ លុបក្រុមទាំងអស់</button>
      </div>

      <!-- Score Cards Grid -->
      <div class="scoreboard-grid" id="teamsContainer">
        <!-- Generated by JS -->
      </div>

    </div>
  </main>

  <script src="../../shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedPage('១៦. ក្តារចុចពិន្ទុក្រុម (Scoreboard)', true);
      
      // Load initial teams or add two defaults
      const stored = localStorage.getItem('edu_hub_scoreboard');
      if (stored) {
        teams = JSON.parse(stored);
        renderTeams();
      } else {
        teams = [
          { name: 'ក្រុមទី ១', score: 0, color: '#f43f5e' },
          { name: 'ក្រុមទី ២', score: 0, color: '#3b82f6' }
        ];
        renderTeams();
      }
    });

    let teams = [];
    const colorPalette = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#8b5cf6', '#d946ef'];

    const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    function toKhmerNum(num) {
      return num.toString().split('').map(char => {
        if (char === '-') return '-';
        if (isNaN(parseInt(char))) return char;
        return khmerDigits[parseInt(char)];
      }).join('');
    }

    function renderTeams() {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      if (teams.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 5rem 1rem;">
            🏆 គ្មានក្រុមឡើយ។ សូមចុចប៊ូតុង "បន្ថែមក្រុមថ្មី" ដើម្បីចាប់ផ្តើម។
          </div>
        `;
        return;
      }

      teams.forEach((team, index) => {
        const card = document.createElement('div');
        card.className = 'team-card glass-panel';
        card.style.setProperty('--team-color', team.color);

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.8rem; background:rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; color:var(--text-secondary);">ក្រុមទី ${toKhmerNum(index + 1)}</span>
            <button onclick="deleteTeam(${index})" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:1.1rem; padding:2px;">❌</button>
          </div>
          
          <input type="text" class="team-name-input" value="${escapeHtml(team.name)}" 
                 onchange="updateTeamName(${index}, this.value)" style="--team-color: ${team.color}">

          <div class="team-score" id="score-${index}">${toKhmerNum(team.score)}</div>

          <!-- Adjusters -->
          <div class="score-controls">
            <button class="score-btn score-btn-plus" onclick="adjustScore(${index}, 1)">+១</button>
            <button class="score-btn score-btn-plus" onclick="adjustScore(${index}, 5)">+៥</button>
            <button class="score-btn score-btn-plus" onclick="adjustScore(${index}, 10)">+១០</button>
            
            <button class="score-btn score-btn-minus" onclick="adjustScore(${index}, -1)">-១</button>
            <button class="score-btn score-btn-minus" onclick="adjustScore(${index}, -5)">-៥</button>
            <button class="score-btn score-btn-minus" onclick="adjustScore(${index}, -10)">-១០</button>
          </div>
        `;
        container.appendChild(card);
      });

      // Save changes
      localStorage.setItem('edu_hub_scoreboard', JSON.stringify(teams));
    }

    function addTeam() {
      playClickSound();
      if (teams.length >= 6) {
        showToast('គាំទ្រក្រុមអតិបរមាចំនួន ៦!', 'error');
        playFailSound();
        return;
      }

      const nextIndex = teams.length;
      const teamColor = colorPalette[nextIndex % colorPalette.length];
      
      teams.push({
        name: `ក្រុមទី ${nextIndex + 1}`,
        score: 0,
        color: teamColor
      });

      renderTeams();
      showToast('បានបន្ថែមក្រុមថ្មី!', 'success');
    }

    function deleteTeam(index) {
      playClickSound();
      if (confirm('តើអ្នកចង់លុបក្រុមនេះមែនទេ?')) {
        teams.splice(index, 1);
        renderTeams();
        showToast('បានលុបក្រុម!', 'success');
      }
    }

    function adjustScore(index, val) {
      playClickSound();
      teams[index].score = Math.max(0, teams[index].score + val);
      document.getElementById(`score-${index}`).textContent = toKhmerNum(teams[index].score);
      
      // Save changes
      localStorage.setItem('edu_hub_scoreboard', JSON.stringify(teams));

      // Trigger confetti on high increments
      if (val >= 5) {
        triggerConfetti();
        playSuccessSound();
      }
    }

    function updateTeamName(index, newName) {
      teams[index].name = newName.trim() || `ក្រុមទី ${index + 1}`;
      localStorage.setItem('edu_hub_scoreboard', JSON.stringify(teams));
    }

    function resetAllScores() {
      playClickSound();
      if (confirm('តើអ្នកចង់កំណត់ពិន្ទុគ្រប់ក្រុមជា ០ វិញមែនទេ?')) {
        teams.forEach(t => t.score = 0);
        renderTeams();
        showToast('បានកំណត់ពិន្ទុឡើងវិញ!', 'success');
      }
    }

    function removeAllTeams() {
      playClickSound();
      if (confirm('តើអ្នកចង់លុបក្រុមទាំងអស់មែនទេ?')) {
        teams = [];
        renderTeams();
        showToast('បានលុបក្រុមទាំងអស់!', 'success');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
