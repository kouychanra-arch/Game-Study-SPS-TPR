<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តម្រៀបអក្សររាយប៉ាយ (Word Scramble)</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    .game-card {
      max-width: 650px;
      margin: 1.5rem auto;
      padding: 2rem;
      text-align: center;
    }

    .hint-box {
      font-size: 4rem;
      margin: 1rem 0;
      animation: bounceHint 2s infinite alternate;
    }

    @keyframes bounceHint {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .scrambled-area, .answer-area {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      min-height: 70px;
      padding: 1rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }

    .scrambled-area {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--glass-border);
    }

    .answer-area {
      background: rgba(168, 85, 247, 0.05);
      border: 2px solid rgba(168, 85, 247, 0.2);
    }

    .letter-block {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      border: 2px solid var(--glass-border);
      background: var(--glass-bg);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .letter-block:hover {
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 6px 12px rgba(168,85,247,0.3);
    }

    .letter-block.used {
      opacity: 0.2;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1" style="background: #8b5cf6;"></div>
    <div class="blob blob-2" style="background: #ec4899;"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="main-container">
    <div class="glass-panel game-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div style="font-size: 1.1rem; font-weight: 600;">ពិន្ទុ៖ <span id="scoreText" style="color: #8b5cf6; font-size: 1.5rem; font-weight: 800;">0</span></div>
        <button class="btn btn-secondary" onclick="skipWord()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">រំលងពាក្យនេះ</button>
      </div>

      <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">🧩 តម្រៀបតួអក្សរខ្មែរឱ្យទៅជាពាក្យត្រឹមត្រូវ</h3>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">ចុចលើប្រអប់អក្សរខាងក្រោម ដើម្បីតម្រៀបចូលប្រអប់ចម្លើយ</p>

      <!-- Emoji Visual Hint -->
      <div class="hint-box" id="hintEmoji">📖</div>

      <!-- Answer Box (Where selected letters go) -->
      <div class="answer-area" id="answerArea">
        <!-- Letters go here -->
      </div>

      <!-- Scrambled Letters Source -->
      <div class="scrambled-area" id="scrambledArea">
        <!-- Letters to select -->
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <button class="btn btn-danger" onclick="clearAnswer()">🔄 រៀបឡើងវិញ</button>
        <button class="btn btn-success" onclick="checkAnswer()">✔️ ផ្ទៀងផ្ទាត់ចម្លើយ</button>
      </div>

    </div>
  </main>

  <script src="../../shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedPage('៨. តម្រៀបអក្សររាយប៉ាយ', true);
      nextWord();
    });

    const vocabulary = [
      { word: 'សៀវភៅ', parts: ['សៀ', 'វ', 'ភៅ'], emoji: '📖' },
      { word: 'សាលារៀន', parts: ['សា', 'ឡា', 'រៀ', 'ន'], emoji: '🏫', fix: ['សា', 'លា', 'រៀ', 'ន'] }, // correct spelling check
      { word: 'ខ្មៅដៃ', parts: ['ខ្មៅ', 'ដៃ'], emoji: '✏️' },
      { word: 'ផ្កា', parts: ['ផ្', 'ក', 'ា'], emoji: '🌸' },
      { word: 'ផ្ទះ', parts: ['ផ្', 'ទ', 'ះ'], emoji: '🏠' },
      { word: 'សិស្ស', parts: ['ស', 'ិ', 'ស្ស'], emoji: '🧑‍🎓' },
      { word: 'ទឹក', parts: ['ទឹ', 'ក'], emoji: '💧' },
      { word: 'ចាប', parts: ['ចា', 'b'], emoji: '🐦', fix: ['ចា', 'ប'] },
      { word: 'ដំរី', parts: ['ដំ', 'រី'], emoji: '🐘' },
      { word: 'កង្កែប', parts: ['ក', 'ង្កែ', 'ប'], emoji: '🐸' },
      { word: 'គណិត', parts: ['គ', 'ណ', 'ិ', 'ត'], emoji: '➕' },
      { word: 'កៅអី', parts: ['កៅ', 'អី'], emoji: '🪑' },
      { word: 'ផ្លែចេក', parts: ['ផ្លែ', 'ចេ', 'ក'], emoji: '🍌' }
    ];

    // Correction: adjust any spelling mismatches
    vocabulary[1].parts = ['សា', 'លា', 'រៀ', 'ន']; // Fix spelling error in sample
    vocabulary[7].parts = ['ចា', 'ប']; // Fix typo 'b'

    let currentWordObj = null;
    let scrambledParts = [];
    let selectedIndices = [];
    let score = 0;

    const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    function toKhmerNum(num) {
      return num.toString().split('').map(char => {
        if (isNaN(parseInt(char))) return char;
        return khmerDigits[parseInt(char)];
      }).join('');
    }

    function nextWord() {
      // Pick random word
      let wordIndex = Math.floor(Math.random() * vocabulary.length);
      currentWordObj = vocabulary[wordIndex];

      document.getElementById('hintEmoji').textContent = currentWordObj.emoji;

      // Scramble the parts
      scrambledParts = [...currentWordObj.parts];
      // Keep shuffling until it's different from the original word
      let isSame = true;
      while (isSame && scrambledParts.length > 1) {
        scrambledParts.sort(() => Math.random() - 0.5);
        isSame = scrambledParts.every((val, index) => val === currentWordObj.parts[index]);
      }

      selectedIndices = [];
      renderScrambled();
      renderAnswer();
    }

    function renderScrambled() {
      const container = document.getElementById('scrambledArea');
      container.innerHTML = '';

      scrambledParts.forEach((part, index) => {
        const block = document.createElement('div');
        block.className = 'letter-block';
        block.textContent = part;
        
        // If this block is already selected, make it visually disabled
        if (selectedIndices.includes(index)) {
          block.classList.add('used');
        } else {
          block.addEventListener('click', () => selectLetter(index));
        }
        
        container.appendChild(block);
      });
    }

    function renderAnswer() {
      const container = document.getElementById('answerArea');
      container.innerHTML = '';

      selectedIndices.forEach(idx => {
        const block = document.createElement('div');
        block.className = 'letter-block';
        block.textContent = scrambledParts[idx];
        
        // Click to remove
        block.addEventListener('click', () => removeLetter(idx));
        container.appendChild(block);
      });
    }

    function selectLetter(index) {
      playClickSound();
      selectedIndices.push(index);
      renderScrambled();
      renderAnswer();
    }

    function removeLetter(index) {
      playClickSound();
      selectedIndices = selectedIndices.filter(idx => idx !== index);
      renderScrambled();
      renderAnswer();
    }

    function clearAnswer() {
      playClickSound();
      selectedIndices = [];
      renderScrambled();
      renderAnswer();
    }

    function checkAnswer() {
      // Join selected parts
      const userSpelling = selectedIndices.map(idx => scrambledParts[idx]).join('');
      const correctSpelling = currentWordObj.word;

      if (userSpelling === correctSpelling) {
        score += 10;
        document.getElementById('scoreText').textContent = toKhmerNum(score);
        playSuccessSound();
        showToast('តម្រៀបបានត្រឹមត្រូវហើយ! 🎉', 'success');

        if (score % 50 === 0) {
          triggerConfetti();
        }

        setTimeout(nextWord, 1000);
      } else {
        playFailSound();
        showToast('មិនទាន់ត្រឹមត្រូវទេ! សាកល្បងតម្រៀបម្តងទៀត', 'error');
      }
    }

    function skipWord() {
      playClickSound();
      nextWord();
    }
  </script>
</body>
</html>
