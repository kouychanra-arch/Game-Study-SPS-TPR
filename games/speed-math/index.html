<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>បូកដកលេខរហ័ស (Speed Math)</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    .game-card {
      max-width: 600px;
      margin: 1.5rem auto;
      padding: 2rem;
      text-align: center;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .question-box {
      font-size: 4rem;
      font-weight: 800;
      margin: 2rem 0;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(249, 115, 22, 0.2);
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .choice-btn {
      padding: 1.25rem;
      font-size: 1.75rem;
      font-weight: 700;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: white;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-khmer);
    }

    .choice-btn:hover {
      background: var(--glass-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.2);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .timer-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #ec4899);
      width: 100%;
      transition: width 0.1s linear;
    }

    .level-select-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      min-height: 250px;
    }
  </style>
</head>
<body>

  <!-- Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1" style="background: #f97316;"></div>
    <div class="blob blob-2" style="background: #eab308;"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="main-container">
    <div class="glass-panel game-card">
      
      <!-- Start screen: Choose Level -->
      <div id="startScreen" class="level-select-container">
        <h3 style="font-size: 1.5rem; font-weight: 700;">🎮 ជ្រើសរើសកម្រិតលំបាក</h3>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
          <button class="btn btn-primary" style="background: #10b981; font-size: 1.1rem; padding: 1rem 2rem;" onclick="startGame('easy')">🟢 ងាយ (១ - ១០)</button>
          <button class="btn btn-primary" style="background: #eab308; font-size: 1.1rem; padding: 1rem 2rem;" onclick="startGame('medium')">🟡 មធ្យម (១ - ៥០)</button>
          <button class="btn btn-primary" style="background: #ef4444; font-size: 1.1rem; padding: 1rem 2rem;" onclick="startGame('hard')">🔴 ពិបាក (១ - ១០០)</button>
        </div>
      </div>

      <!-- Play Screen -->
      <div id="playScreen" style="display: none;">
        <div class="game-header">
          <div style="font-size: 1.1rem; font-weight: 600;">ពិន្ទុ៖ <span id="scoreText" style="color: #f97316; font-size: 1.5rem; font-weight: 800;">0</span></div>
          <div style="font-size: 1.1rem; font-weight: 600;">ពេលវេលា៖ <span id="timeText" style="color: #ef4444; font-size: 1.3rem;">30</span> វិនាទី</div>
        </div>

        <div class="timer-bar-container">
          <div id="timerBar" class="timer-bar-fill"></div>
        </div>

        <div class="question-box" id="questionText">
          5 + 3 = ?
        </div>

        <div class="choices-grid" id="choicesContainer">
          <!-- Choice buttons dynamically added -->
        </div>
      </div>

      <!-- Result Screen -->
      <div id="resultScreen" style="display: none; padding: 2rem 0;">
        <h3 style="font-size: 2.2rem; font-weight: 800; color: #10b981; margin-bottom: 1rem;">🏁 អស់ម៉ោងហើយ!</h3>
        <p style="font-size: 1.3rem; margin-bottom: 2rem;">ពិន្ទុដែលអ្នកទទួលបានគឺ៖ <span style="font-size: 2rem; font-weight: 800; color: #f97316;" id="finalScore">0</span></p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
          <button class="btn btn-primary" onclick="restartGame()">លេងម្តងទៀត</button>
          <a href="../../index.html" class="btn btn-secondary">ត្រឡប់ទៅទំព័រដើម</a>
        </div>
      </div>

    </div>
  </main>

  <script src="../../shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedPage('២. បូកដកលេខរហ័ស (Speed Math)', true);
    });

    let score = 0;
    let timeLeft = 30;
    const totalTime = 30;
    let timerInterval = null;
    let currentAnswer = 0;
    let currentLevel = 'easy';

    const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    function toKhmerNum(num) {
      return num.toString().split('').map(char => {
        if (char === '-') return '-';
        if (isNaN(parseInt(char))) return char;
        return khmerDigits[parseInt(char)];
      }).join('');
    }

    function startGame(level) {
      playClickSound();
      currentLevel = level;
      score = 0;
      timeLeft = totalTime;
      
      document.getElementById('scoreText').textContent = toKhmerNum(score);
      document.getElementById('timeText').textContent = toKhmerNum(timeLeft);
      document.getElementById('timerBar').style.width = '100%';
      
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('playScreen').style.display = 'block';
      document.getElementById('resultScreen').style.display = 'none';

      nextQuestion();
      
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timeText').textContent = toKhmerNum(timeLeft);
        document.getElementById('timerBar').style.width = (timeLeft / totalTime * 100) + '%';
        
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function nextQuestion() {
      let maxNum = 10;
      if (currentLevel === 'medium') maxNum = 50;
      if (currentLevel === 'hard') maxNum = 100;

      let num1 = Math.floor(Math.random() * maxNum) + 1;
      let num2 = Math.floor(Math.random() * maxNum) + 1;
      
      // Select operator (+ or -)
      const op = Math.random() > 0.5 ? '+' : '-';
      
      if (op === '-') {
        // Ensure no negative answers for kids unless hard
        if (num1 < num2 && currentLevel !== 'hard') {
          const temp = num1;
          num1 = num2;
          num2 = temp;
        }
        currentAnswer = num1 - num2;
      } else {
        currentAnswer = num1 + num2;
      }

      document.getElementById('questionText').innerHTML = `${toKhmerNum(num1)} ${op === '+' ? '＋' : '－'} ${toKhmerNum(num2)} ＝ ?`;

      // Generate Choices
      const choices = new Set();
      choices.add(currentAnswer);
      
      while (choices.size < 4) {
        // Generate values close to correct answer
        const offset = Math.floor(Math.random() * 10) - 5;
        const fakeAns = currentAnswer + offset;
        if (fakeAns !== currentAnswer && (fakeAns >= 0 || currentLevel === 'hard')) {
          choices.add(fakeAns);
        }
      }

      // Render choices
      const choicesArr = Array.from(choices).sort(() => Math.random() - 0.5);
      const container = document.getElementById('choicesContainer');
      container.innerHTML = '';

      choicesArr.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = toKhmerNum(choice);
        btn.addEventListener('click', () => submitAnswer(choice));
        container.appendChild(btn);
      });
    }

    function submitAnswer(chosenVal) {
      if (timeLeft <= 0) return;

      if (chosenVal === currentAnswer) {
        score += 10;
        document.getElementById('scoreText').textContent = toKhmerNum(score);
        playSuccessSound();
        showToast('ត្រឹមត្រូវ! 🎉', 'success');
      } else {
        // Penalty on wrong answer
        score = Math.max(0, score - 5);
        document.getElementById('scoreText').textContent = toKhmerNum(score);
        playFailSound();
        showToast('ខុសហើយ! ព្យាយាមម្តងទៀត', 'error');
      }
      nextQuestion();
    }

    function endGame() {
      clearInterval(timerInterval);
      document.getElementById('playScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';
      document.getElementById('finalScore').textContent = toKhmerNum(score);
      
      if (score > 30) {
        triggerConfetti();
        playSuccessSound();
      } else {
        playFailSound();
      }
    }

    function restartGame() {
      playClickSound();
      document.getElementById('startScreen').style.display = 'flex';
      document.getElementById('resultScreen').style.display = 'none';
    }
  </script>
</body>
</html>
