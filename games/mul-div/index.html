<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>មេគុណនិងចែក (Multiplication & Division)</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    .game-card {
      max-width: 750px;
      margin: 1.5rem auto;
      padding: 2rem;
    }

    .game-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 768px) {
      .game-layout {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    .visual-box {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      border: 1px dashed var(--glass-border);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
    }

    /* Grid for Multiplication Visual */
    .mult-grid {
      display: grid;
      gap: 6px;
      margin-top: 1rem;
    }

    .mult-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eab308, #f97316);
      box-shadow: 0 2px 6px rgba(234, 179, 8, 0.4);
    }

    /* Groups for Division Visual */
    .div-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .div-group-box {
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      min-width: 60px;
      min-height: 60px;
      padding: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
    }

    .div-item {
      font-size: 1.2rem;
    }

    .choices-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .choice-btn {
      padding: 1rem;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: white;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-khmer);
    }

    .choice-btn:hover {
      background: var(--glass-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
      border-color: rgba(234, 179, 8, 0.5);
    }

    .menu-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 250px;
    }
  </style>
</head>
<body>

  <!-- Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1" style="background: #eab308;"></div>
    <div class="blob blob-2" style="background: #f97316;"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="main-container">
    <div class="glass-panel game-card">
      
      <!-- Menu Screen -->
      <div id="menuScreen" class="menu-screen">
        <h3 style="font-size: 1.6rem; font-weight: 700;">✖️➕ Choose Study Mode ➗➖</h3>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
          <button class="btn btn-primary" style="background: #eab308; font-size: 1.2rem; padding: 1rem 2rem;" onclick="startMode('multiply')">✖️ ល្បែងគុណលេខ</button>
          <button class="btn btn-primary" style="background: #0ea5e9; font-size: 1.2rem; padding: 1rem 2rem;" onclick="startMode('divide')">➗ ល្បែងចែកលេខ</button>
        </div>
      </div>

      <!-- Play Screen -->
      <div id="playScreen" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div style="font-size: 1.1rem; font-weight: 600;">ពិន្ទុ៖ <span id="scoreText" style="color: #eab308; font-size: 1.5rem; font-weight: 800;">0</span></div>
          <button class="btn btn-secondary" onclick="exitToMenu()" style="padding: 0.5rem 1rem; font-size: 0.9rem;">ប្តូររបៀបលេង</button>
        </div>

        <h3 style="font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 1rem;" id="instructions">តើប៉ុន្មានគុណនឹងប៉ុន្មាន?</h3>

        <div class="game-layout">
          <!-- Visual Helper Panel -->
          <div class="visual-box">
            <div style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">រូបភាពជំនួយគំនិត</div>
            <div id="visualContent" style="width: 100%; display: flex; justify-content: center; align-items: center; flex-grow: 1;">
              <!-- Visual elements drawn dynamically -->
            </div>
          </div>

          <!-- Problem & Choices Panel -->
          <div style="display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 3rem; font-weight: 800; text-align: center; margin-bottom: 1.5rem; color: var(--text-primary);" id="problemText">
              4 x 3 = ?
            </div>

            <div class="choices-list" id="choicesContainer">
              <!-- Choices dynamically generated -->
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="../../shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedPage('៣. មេគុណនិងចែក (Multiplication & Division)', true);
    });

    let gameMode = 'multiply'; // multiply or divide
    let score = 0;
    let currentAnswer = 0;
    let num1 = 0;
    let num2 = 0;

    const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    function toKhmerNum(num) {
      return num.toString().split('').map(char => {
        if (isNaN(parseInt(char))) return char;
        return khmerDigits[parseInt(char)];
      }).join('');
    }

    function startMode(mode) {
      playClickSound();
      gameMode = mode;
      score = 0;
      document.getElementById('scoreText').textContent = toKhmerNum(score);
      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('playScreen').style.display = 'block';
      nextQuestion();
    }

    function exitToMenu() {
      playClickSound();
      document.getElementById('menuScreen').style.display = 'flex';
      document.getElementById('playScreen').style.display = 'none';
    }

    function nextQuestion() {
      const container = document.getElementById('visualContent');
      container.innerHTML = '';

      if (gameMode === 'multiply') {
        document.getElementById('instructions').textContent = 'សូមសង្កេតមើលចំណុច ហើយគណនាមេគុណខាងក្រោម៖';
        
        // Multiplier from 1 to 9, multiplicand from 1 to 9
        num1 = Math.floor(Math.random() * 8) + 2; // 2 to 9
        num2 = Math.floor(Math.random() * 8) + 2; // 2 to 9
        currentAnswer = num1 * num2;
        
        document.getElementById('problemText').innerHTML = `${toKhmerNum(num1)} <span style="color:#eab308">×</span> ${toKhmerNum(num2)} ＝ ?`;
        
        // Draw grid
        const grid = document.createElement('div');
        grid.className = 'mult-grid';
        grid.style.gridTemplateColumns = `repeat(${num2}, 1fr)`;
        for (let i = 0; i < num1 * num2; i++) {
          const dot = document.createElement('div');
          dot.className = 'mult-dot';
          grid.appendChild(dot);
        }
        container.appendChild(grid);
      } else {
        document.getElementById('instructions').textContent = 'សូមសង្កេតការបែងចែកផ្លែឈើជាក្រុមស្មើៗគ្នា៖';
        
        // Divisor from 2 to 6, Quotient from 2 to 8
        num2 = Math.floor(Math.random() * 5) + 2; // Divisor (2 to 6)
        const quotient = Math.floor(Math.random() * 6) + 2; // Quotient (2 to 7)
        num1 = num2 * quotient; // Dividend
        currentAnswer = quotient;
        
        document.getElementById('problemText').innerHTML = `${toKhmerNum(num1)} <span style="color:#0ea5e9">÷</span> ${toKhmerNum(num2)} ＝ ?`;
        
        // Draw group sharing visual representation
        const groupContainer = document.createElement('div');
        groupContainer.className = 'div-groups';
        
        // Fruits/emojis list
        const items = ['🍎', '🍌', '🍊', '🍓', '🍇', '🍒', '🍋', '🍩'];
        const chosenItem = items[Math.floor(Math.random() * items.length)];

        for (let i = 0; i < num2; i++) {
          const groupBox = document.createElement('div');
          groupBox.className = 'div-group-box';
          
          for (let j = 0; j < quotient; j++) {
            const item = document.createElement('span');
            item.className = 'div-item';
            item.textContent = chosenItem;
            groupBox.appendChild(item);
          }
          groupContainer.appendChild(groupBox);
        }
        container.appendChild(groupContainer);
      }

      // Generate 4 choice answers
      const choices = new Set();
      choices.add(currentAnswer);
      
      while (choices.size < 4) {
        let fakeAns = 0;
        if (gameMode === 'multiply') {
          // Offsets for multiplication error models (like offset values or neighbor facts)
          const offset = Math.floor(Math.random() * 12) - 6;
          fakeAns = currentAnswer + offset;
        } else {
          const offset = Math.floor(Math.random() * 4) - 2;
          fakeAns = currentAnswer + offset;
        }
        if (fakeAns > 0 && fakeAns !== currentAnswer) {
          choices.add(fakeAns);
        }
      }

      // Render choices
      const choicesArr = Array.from(choices).sort(() => Math.random() - 0.5);
      const choiceBox = document.getElementById('choicesContainer');
      choiceBox.innerHTML = '';

      choicesArr.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = toKhmerNum(ans);
        btn.addEventListener('click', () => submitAnswer(ans));
        choiceBox.appendChild(btn);
      });
    }

    function submitAnswer(chosenVal) {
      if (chosenVal === currentAnswer) {
        score += 10;
        document.getElementById('scoreText').textContent = toKhmerNum(score);
        playSuccessSound();
        showToast('ឆ្លើយត្រូវហើយ! ពូកែមែន 🌟', 'success');
        
        // Show fireworks/confetti on every 5 correct answers
        if (score % 50 === 0) {
          triggerConfetti();
        }
        
        nextQuestion();
      } else {
        playFailSound();
        showToast('មិនត្រឹមត្រូវទេ! សាកល្បងគណនាម្តងទៀត', 'error');
      }
    }
  </script>
</body>
</html>
